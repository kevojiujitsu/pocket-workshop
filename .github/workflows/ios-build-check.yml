name: iOS build check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocket-workshop-ios-check
  cancel-in-progress: false
jobs:
  ios-check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Build and sync mobile web assets
        working-directory: mobile
        run: |
          npm ci
          node rewarded-controller.test.mjs
          npm run build
          npx cap sync ios
      - name: Add simulator-only screenshot navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path('mobile/ios/App/App/public/index.html')
          driver='<script>setTimeout(()=>document.getElementById("continueGame").click(),11000);setTimeout(()=>document.getElementById("beginRepair").click(),14000);</script>'
          page.write_text(page.read_text().replace('</body>',driver+'</body>'))
          PY
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app \
            Pocket-Workshop-iOS-Simulator.zip
      - name: Capture native simulator launch screenshots
        run: |
          mkdir -p ios-screenshots
          xcrun simctl list devices available --json > devices.json
          python3 - <<'PY'
          import json
          devices=json.load(open('devices.json'))['devices']
          rows=[d for runtime in sorted(devices,reverse=True) for d in devices[runtime] if d.get('isAvailable')]
          choices=[next(d for d in rows if 'iPhone' in d['name'] and 'Pro' in d['name'] and 'Max' not in d['name']),next(d for d in rows if 'iPad Pro' in d['name'] and '13' in d['name'])]
          with open('capture-devices.tsv','w') as out:
              for label,device in zip(['iphone','ipad'],choices): out.write(label+'\t'+device['udid']+'\n')
          PY
          while IFS=$'\t' read -r label device; do
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time '9:41' --batteryState charged --batteryLevel 100
            xcrun simctl install "$device" build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
            xcrun simctl launch "$device" com.kevthedev.pocketworkshop
            sleep 8
            xcrun simctl io "$device" screenshot "ios-screenshots/$label-workshop.png"
            sleep 10
            xcrun simctl io "$device" screenshot "ios-screenshots/$label-puzzle.png"
            xcrun simctl shutdown "$device"
          done < capture-devices.tsv
      - name: Save build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-workshop-ios-check
          path: |
            Pocket-Workshop-iOS-Simulator.zip
            ios-build.log
            ios-screenshots/*.png
          retention-days: 3
